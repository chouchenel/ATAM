  $('rb').innerHTML=h})}

function fresh(){return{red:0,blue:0,redG:0,blueG:0,round:1,remain:120000,endAt:0,run:false,ph:'idle',rn:'Hung',bn:'Chung',mn:1,rw:{red:0,blue:0},st:{red:{p:0,b:0,h:0},blue:{p:0,b:0,h:0}}}}

function sync(){db.ref(P+'/st').set(S).then(()=>{$('cs').textContent=''}).catch(e=>{$('cs').textContent='SYNC ERROR: '+e.message});draw()}
function draw(){if(!$('rs'))return;$('rs').textContent=S.red;$('bs').textContent=S.blue;$('rg').textContent='Gam-jeom: '+S.redG;$('bg').textContent='Gam-jeom: '+S.blueG;
 $('tm').textContent=fmt(left());$('rd').textContent='Round '+S.round+' · '+S.ph+' · wins '+S.rw.red+'-'+S.rw.blue;$('go').textContent=S.run?'Pause':'Start'}
function nm(){S.rn=$('rn').value;S.bn=$('bn').value;sync()}
function log(txt){const e={txt,rd:S.round,mt:cfg.round*1000-left(),vt:t0?(Date.now()-t0)/1000:null};E.push(e);db.ref(P+'/ev').push(e)}
function ev(side,txt){S.ev={id:Date.now(),side,txt}}
function award(side,type){const v=cfg.pt[type];S[side]+=v;S.st[side][CAT[type]]++;ev(side,NM[type]+' +'+v);log(side+' '+NM[type]+' +'+v);chk()}
function chk(){if(Math.abs(S.red-S.blue)>=12||S.redG>=5||S.blueG>=5)endRound();else sync()}
function adj(side,d){S[side]=Math.max(0,S[side]+d);log('Manual '+side+' '+d);chk()}
function gam(side){const o=side=='red'?'blue':'red';S[side+'G']++;S[o]++;ev(o,'GAM-JEOM +1');log('Gam-jeom '+side+' (+1 '+o+')');chk()}
function toggle(){if(S.ph=='idle'){S.ph='fight';S.snd={id:Date.now()}}
 if(S.ph!='fight')return;
 if(!S.run){S.endAt=now()+S.remain;S.run=true}else{S.remain=left();S.run=false}sync()}
function endRound(){if(S.ph=='tie')S.ph='fight';if(S.ph!='fight')return;
 const w=S.redG>=5?'blue':S.blueG>=5?'red':S.red>S.blue?'red':S.blue>S.red?'blue':null;
 S.run=false;S.remain=0;S.snd={id:Date.now()};
 if(!w){S.ph='tie';log('TIE');sync();return}
 S.rw[w]++;S.res={w,rd:S.round,red:S.red,blue:S.blue,st:JSON.parse(JSON.stringify(S.st))};log('Round '+S.round+' won by '+w);
 if(S.rw[w]>=2)S.ph='done';else{S.ph='rest';S.remain=(cfg.rest||60)*1000;S.endAt=now()+S.remain;S.run=true}
 sync()}
function nextRound(){S.round++;S.ph='fight';S.red=0;S.blue=0;S.redG=0;S.blueG=0;S.st={red:{p:0,b:0,h:0},blue:{p:0,b:0,h:0}};
 S.run=false;S.remain=cfg.round*1000;delete S.res;S.snd={id:Date.now()};sync()}
function mark(){log('VIDEO MARK');navigator.vibrate&&navigator.vibrate(60)}
function newM(){if(confirm('Start a NEW match?'))location.href=location.pathname+'?m='+Math.random().toString(36).slice(2,7)+'&r=c&n='+(S.mn+1)}
async function cam(){try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
 $('pv').srcObject=st;chunks=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.start(3000);t0=Date.now()}
 catch(e){alert('Camera error: '+e.message)}}
function review(){if(S.run&&S.ph=='fight')toggle();S.replay=true;sync();
 $('panel').innerHTML=`<video id="rv" controls playsinline style="width:100%"></video><div class="row"><button class="gray" onclick="spd(.25)">0.25x</button><button class="gray" onclick="spd(.5)">0.5x</button><button class="gray" onclick="spd(1)">1x</button><button class="gray" onclick="$('rv').requestFullscreen()">Full screen</button><button class="red" onclick="closeR()">Exit review</button></div><div id="el"></div>`;
 $('el').innerHTML=E.slice().reverse().map(e=>`<button class="gray ev" onclick="seek(${e.vt})">R${e.rd} · ${fmt(e.mt)} · ${e.txt}</button>`).join('')||'No events yet';
 if(rec){rec.requestData();setTimeout(()=>{const rv=$('rv');rv.src=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));
  rv.onloadedmetadata=()=>{if(rv.duration===Infinity){rv.currentTime=1e101;rv.ontimeupdate=()=>{rv.ontimeupdate=null;rv.currentTime=0}}}},400)}}
function closeR(){S.replay=false;sync();$('panel').innerHTML=''}
function seek(vt){const rv=$('rv');if(vt==null||!rv)return;rv.currentTime=Math.max(0,vt-3);rv.play()}
function spd(x){$('rv').playbackRate=x}
function qrs(){const b=location.origin+location.pathname,p=$('panel');p.innerHTML='';
 [['r1','Red 1'],['r2','Red 2'],['b1','Blue 1'],['b2','Blue 2'],['d','Display']].forEach(([r,n])=>{
  const d=document.createElement('div');d.className='qr';d.innerHTML='<b>'+n+'</b><div></div>';p.appendChild(d);
  new QRCode(d.lastChild,{text:b+'?m='+M+'&r='+r,width:140,height:140})})}
function sets(){$('panel').innerHTML=Object.keys(NM).map(t=>`${NM[t]} <input type="number" id="s_${t}" value="${cfg.pt[t]}">`).join('<br>')+
 `<br>Round seconds <input type="number" id="s_r" value="${cfg.round}"><br>Rest seconds <input type="number" id="s_t" value="${cfg.rest||60}"><br><button class="green" onclick="saveS()">Save</button>`}
function saveS(){for(const t in NM)cfg.pt[t]=+$('s_'+t).value;cfg.round=+$('s_r').value;cfg.rest=+$('s_t').value;
 localStorage.atam=JSON.stringify(cfg);db.ref(P+'/cfg').set(cfg);if(!S.run&&S.ph!='rest')S.remain=cfg.round*1000;sync();$('panel').innerHTML='Saved ✔'}

if(/^[rb][12]$/.test(R))referee();else if(R=='d')display();else central();
</script></body></html>
