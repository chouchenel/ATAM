  for(const t in NM)h+=`<button class="${side}" style="width:100%;height:17vh;font-size:7vw;margin:3px 0" onclick="hit('${side}','${t}')">${NM[t]} +${c.pt[t]}</button>`;
  $('rb').innerHTML=h})}
